name: Back up database

# Every 5 minutes (GitHub's minimum; scheduled runs can start a few minutes late):
# checks that Neon answers and copies it into the Supabase backup. If Neon stops
# answering, scripts/watch-neon.sh switches the app to Supabase and this run fails,
# so GitHub emails you. "Run workflow" starts a run now.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      # pg_dump must be at least as new as the server (Neon runs Postgres 18).
      - name: Install Postgres 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Check Neon
        id: watch
        run: |
          set +e
          scripts/watch-neon.sh
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 3 = already failed over: nothing to do, not an error.
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]

      - name: Copy Neon to Supabase
        if: steps.watch.outputs.code == '0'
        run: scripts/backup-db.sh
