name: Back up database

# Copies the live Neon database into the Supabase backup every 15 minutes.
# GitHub may start scheduled runs a few minutes late; "Run workflow" starts one now.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # pg_dump must be at least as new as the server (Neon runs Postgres 18).
      - name: Install Postgres 18 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 >/dev/null
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Copy Neon to Supabase
        env:
          SOURCE_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: scripts/backup-db.sh
